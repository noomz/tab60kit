<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; connect-src 'none'; script-src 'self'; object-src 'none'; base-uri 'none'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>tab60kit lab U1</title>
		<script type="module" src="./u1.js"></script>
	</head>
	<body>
		<h1>tab60kit lab: U1 bootloader round trip and read-only deep check</h1>
		<p id="clearance"></p>
		<p>
			<button id="connect" type="button" disabled>Connect</button>
			<button id="deepcheck" type="button" disabled>Deep check</button>
			<button id="pick" type="button" hidden>Pick</button>
			<button id="cancel" type="button" hidden>Cancel</button>
			<button id="tryagain" type="button" hidden>Try again</button>
			<button id="restart" type="button" hidden>Restart into normal mode</button>
			<button id="download" type="button" disabled>Download transcript</button>
		</p>
		<p id="pickhint" hidden></p>
		<p>Keep this tab visible while a run is going. Chrome slows the timers of a hidden tab, and check 9 measures them.</p>
		<pre id="recovery" hidden></pre>
		<p>
			<label>Typing check (type here after the run): <input id="typing" type="text" autocomplete="off" /></label>
		</p>
		<p id="frames"></p>
		<ol id="checks"></ol>
		<ul id="findings"></ul>
		<pre id="log"></pre>
	</body>
</html>
